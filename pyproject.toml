[project]
name = "luca-mcp"
version = "0.4.0"
description = "Luca MCP client: Liebre accounting tools for Claude Code, Codex and other MCP agents (stdio)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # stdio MCP server framework
    "fastmcp==4.0.3",
    "mcp==2.2.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    # OS keychain for the rai tokens (file fallback when unavailable)
    "keyring>=25",
]

[project.scripts]
luca-mcp = "luca_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff==0.13.2",
    # dev/mock_idp.py mints RS256 tokens
    "pyjwt[crypto]>=2.10",
    "starlette>=0.47",
    "uvicorn>=0.35",
    "cryptography>=45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luca_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".git", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
