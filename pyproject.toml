[project]
name = "luca-mcp"
version = "0.1.0"
description = "Luca MCP: Liebre accounting for AI agents (Claude Code, Codex, Cursor, claude.ai)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # MCP server framework. Pinned: the OAuth proxy subclass in src/luca_mcp/auth.py
    # relies on internals verified against exactly this version (see docs/plans).
    "fastmcp==4.0.3",
    "mcp==2.2.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    # Shared OAuth state store (memory for the single-instance beta, redis after).
    "py-key-value-aio[redis]>=0.4.5",
    "cryptography>=45",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff==0.13.2",
    # dev/mock_idp.py mints RS256 tokens; the e2e harness decodes them.
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luca_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".git", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
