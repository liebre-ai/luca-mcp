name: Version
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # GitLab mirror that runs the tag-driven build/deploy pipeline (.gitlab-ci.yml).
  GITLAB_REPO: solutions/liebre/luca-mcp

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create version tag
        id: agileflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          OUTPUT=$(npx @logickernel/agileflow github 2>&1) || true
          echo "$OUTPUT"
          NEW_TAG=$(echo "$OUTPUT" | grep -oP 'Tag \Kv\S+(?= created)' || echo "")
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Push tag to GitLab
        if: steps.agileflow.outputs.new_tag != ''
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          TAG="${{ steps.agileflow.outputs.new_tag }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git push "https://oauth2:${GITLAB_TOKEN}@code.logickernel.com/${GITLAB_REPO}.git" "$TAG"
          echo "Pushed $TAG to GitLab"
